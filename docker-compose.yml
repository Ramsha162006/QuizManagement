services:
  mysqldb:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
      MYSQL_DATABASE: QuizManagementApp
    ports:
      - '3307:3306'
    volumes:
      - mysql_data:/var/lib/mysql

  web-app:
    depends_on:
      - mysqldb
    build: .
    ports:
      - '3000:3000'
    environment:
      - DB_HOST=mysqldb
      - DB_PASSWORD=${DB_PASSWORD}
      - DB_NAME=QuizManagementApp
      - GEMINI_API_KEY=${GEMINI_API_KEY}

volumes:
  mysql_data:
