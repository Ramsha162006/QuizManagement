<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Admin</title>
    <link rel="stylesheet" href="admin.css">
</head>

<body>
    <a href="/" style="display: inline-block; margin-bottom: 15px; padding: 8px 14px; background: #10b981; color: white; border-radius: 6px; text-decoration: none; font-size: 14px;">
        ← Start Quiz
    </a>


    <div class="admin-container">

        <h1>Quiz Management</h1>

        <!-- ADD QUESTION -->
        <section class="form-section">

            <h2>Add New Question</h2>

            <form id="question-form">

                <label for="question-text">Question</label>
                <input type="text" id="question-text" required>

                <label for="option-a">Option A</label>
                <input type="text" id="option-a" required>

                <label for="option-b">Option B</label>
                <input type="text" id="option-b" required>

                <label for="option-c">Option C</label>
                <input type="text" id="option-c" required>

                <label for="option-d">Option D</label>
                <input type="text" id="option-d" required>

                <label for="correct-option">Correct Option</label>

                <select id="correct-option" required>
                    <option value="">Select correct option</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>

                <button type="submit">Add Question</button>

            </form>

            <p id="message"></p>

        </section>

        <!-- AI Quiz Generator -->
<button type="button" id="ai-generator-btn">
    ✨ AI Quiz Generator
</button>

<div id="ai-generator-section" style="display: none;">

    <h2>✨ Generate Quiz with AI</h2>

    <form id="ai-quiz-form">

        <label for="ai-topic">Topic</label>
        <input
            type="text"
            id="ai-topic"
            placeholder="e.g. C++, JavaScript, DBMS"
            required
        >

        <label for="ai-count">Number of Questions</label>
        <select id="ai-count">
            <option value="5">5</option>
            <option value="10">10</option>
        </select>

        <label for="ai-difficulty">Difficulty</label>
        <select id="ai-difficulty">
            <option value="Easy">Easy</option>
            <option value="Medium" selected>Medium</option>
            <option value="Hard">Hard</option>
        </select>

        <button type="submit" id="generate-ai-btn">
            Generate Quiz
        </button>

    </form>

    <p id="ai-message"></p>

</div>


        <!-- ALL QUESTIONS -->

        <section class="questions-section">

            <h2>All Questions</h2>

            <div id="questions-list"></div>

        </section>


        <!-- EDIT QUESTION -->

        <section id="edit-section" style="display: none;">

            <h2>Edit Question</h2>

            <form id="edit-form">

                <input type="hidden" id="edit-id">

                <label for="edit-question-text">Question</label>
                <input type="text" id="edit-question-text" required>

                <label for="edit-option-a">Option A</label>
                <input type="text" id="edit-option-a" required>

                <label for="edit-option-b">Option B</label>
                <input type="text" id="edit-option-b" required>

                <label for="edit-option-c">Option C</label>
                <input type="text" id="edit-option-c" required>

                <label for="edit-option-d">Option D</label>
                <input type="text" id="edit-option-d" required>

                <label for="edit-correct-option">Correct Option</label>

                <select id="edit-correct-option" required>
                    <option value="">Select correct option</option>
                    <option value="A">A</option>
                    <option value="B">B</option>
                    <option value="C">C</option>
                    <option value="D">D</option>
                </select>

                <button type="submit">Update Question</button>

            </form>

        </section>

    </div>

    <script src="admin.js"></script>

</body>

</html>
