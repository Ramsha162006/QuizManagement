<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quiz Master</title>

    <link rel="stylesheet" href="quiz.css">
</head>

<body>

    <div class="quiz-container">

        <!-- Header -->
        <div class="quiz-header">

            <div>
                <h1>Quiz Master</h1>
                <p>Test your knowledge</p>
                <a href="/admin.html" style="display: inline-block; margin-top: 8px; padding: 6px 12px; background: #6366f1; color: white; border-radius: 6px; text-decoration: none; font-size: 13px;">
                    ✨ Generate AI Quiz (Admin)
                </a>

            </div>

            <button id="theme-btn">🌙</button>

        </div>


        <!-- Question information -->
        <div class="question-info">

            <span id="question-number">
                Question 1 of 5
            </span>

            <p id="score">Score: 0</p>
            <p id="timer">⏱️ Time Left: 10:00</p>

        </div>


        <!-- Progress bar -->
        <div class="progress-container">
            <div id="progress-bar"></div>
        </div>


        <!-- Question -->
        <div id="result-screen" style="display: none;">

    <h2>🎉 Quiz Completed!</h2>

    <p id="final-score"></p>

    <p id="final-percentage"></p>

</div>

<h2 id="question"></h2>


        <!-- Options -->
        <div class="options-container">

            <button class="option"></button>

            <button class="option"></button>

            <button class="option"></button>

            <button class="option"></button>

        </div>


        <!-- Next button -->
        <button id="nxtbtn">
            Next Question →
        </button>
        <button id="finish-btn">Finish Quiz</button>
        <!-- Restart button -->
        <button id="restart-btn">
            Restart Quiz
        </button>

    </div>

    <!-- Finish Quiz Popup -->
<div id="finish-popup" class="popup-overlay">

    <div class="popup-box">

        <h2>Finish Quiz?</h2>

        <p>Are you sure you want to finish the quiz?</p>

        <div class="popup-buttons">
            <button id="cancel-finish">Cancel</button>
            <button id="confirm-finish">Finish Quiz</button>
        </div>

    </div>

</div>

    <script src="quiz.js"></script>

</body>

</html>
